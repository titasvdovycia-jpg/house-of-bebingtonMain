<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Chess Directory | Find Active Chess Clubs & ECF/FIDE Events</title>
    <meta name="description" content="Discover active chess clubs, congresses, and rapidplays across the UK. Featuring ECF/FIDE rated events, driving directions, and local club discovery.">
    <meta name="keywords" content="UK Chess, Chess Clubs UK, ECF rated events, FIDE chess tournaments, local chess clubs, chess directory uk, chess congresses, rapidplay chess">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ukchessdirectory.com/">
    <meta property="og:title" content="UK Chess Directory | Find Active Clubs & Events">
    <meta property="og:description" content="The ultimate hub for UK chess players. Find clubs, events, and driving times in seconds.">
    <meta property="og:image" content="https://ukchessdirectory.com/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="UK Chess Directory | Find Active Clubs & Events">
    <meta property="twitter:description" content="The ultimate hub for UK chess players. Find clubs, events, and driving times in seconds.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: {
                            100: '#f2f0e4',
                            400: '#e29b82',
                            500: '#d97757',
                            600: '#b86448',
                            700: '#8c4b35',
                        },
                        slate: {
                            800: '#1d2e27',
                            900: '#11211b',
                            950: '#0d1a15',
                        },
                        cyan: {
                            300: '#d97757',
                            400: '#e29b82',
                            500: '#b86448',
                            600: '#8c4b35',
                        },
                        purple: {
                            400: '#2d453b',
                            600: '#1d2e27',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        title: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="bg-slate-950 text-white font-sans selection:bg-blue-500/30 selection:text-blue-100 overflow-x-hidden">

    <!-- Colorful Glow Splashes -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[10%] w-[30%] h-[30%] bg-purple-600/20 rounded-full blur-[100px] pointer-events-none z-0"></div>

    <!-- ============================
         PAGE: DIRECTORY (Clubs + Tournaments merged)
         ============================ -->
    <div id="page-directory">
">
        <div class="pt-20 min-h-screen flex flex-col">
            <div class="flex flex-col md:flex-row flex-1" style="height: calc(100vh - 80px);">
                <!-- LEFT: Sidebar -->
                <aside id="directory-sidebar" class="w-full md:w-[380px] h-[50vh] md:h-full flex-shrink-0 bg-slate-950/98 border-r md:border-b-0 border-b border-white/10 flex flex-col overflow-y-auto z-20">
                    <div class="p-6">
                        <!-- Header -->
                        <div class="mb-5">
                            <h2 class="font-title font-extrabold text-2xl uppercase tracking-tighter text-white">Chess <span class="font-light text-blue-400">Directory</span></h2>
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">UK Clubs &amp; Tournaments</p>
                        </div>

                        <!-- Show/Hide toggles -->
                        <div class="flex gap-3 mb-5">
                            <label id="toggle-clubs-label" class="flex-1 flex items-center justify-center gap-2 py-2.5 border rounded-sm cursor-pointer transition-all border-blue-500 bg-blue-600/20">
                                <input type="checkbox" id="show-clubs" checked class="hidden" onchange="app.filterDirectory()">
                                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                                <span class="text-xs font-bold uppercase tracking-wider text-white">Clubs</span>
                            </label>
                            <label id="toggle-events-label" class="flex-1 flex items-center justify-center gap-2 py-2.5 border rounded-sm cursor-pointer transition-all border-orange-500 bg-orange-500/20">
                                <input type="checkbox" id="show-events" checked class="hidden" onchange="app.filterDirectory()">
                                <span class="w-2 h-2 rounded-full bg-orange-400"></span>
                                <span class="text-xs font-bold uppercase tracking-wider text-white">Tournaments</span>
                            </label>
                        </div>

                        <!-- Search -->
                        <div class="relative mb-4">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                            <input id="directory-search" type="text" placeholder="Search clubs, events, cityâ€¦"
                                class="w-full bg-white/5 border border-white/10 rounded-sm py-3 pl-10 pr-4 text-sm text-white outline-none focus:border-blue-500 transition-colors placeholder-gray-600"
                                oninput="app.filterDirectory()">
                        </div>

                        <!-- Locate Me -->
                        <button id="dir-locate" onclick="app.locateUser('directory')" class="w-full py-3 bg-white/10 hover:bg-blue-600 border border-white/10 hover:border-blue-500 text-white font-bold uppercase text-xs tracking-widest rounded-sm mb-5 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="navigation" class="w-4 h-4"></i> Find Nearby
                        </button>

                        <!-- Filters -->
                        <div class="space-y-4 mb-5">
                            <!-- County -->
                            <div>
                                <h3 class="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-2 border-b border-white/10 pb-2">County / Region</h3>
                                <div class="relative">
                                    <select id="dir-county" onchange="app.filterDirectory()" class="w-full bg-slate-900 border border-white/10 rounded-sm p-3 text-xs text-white outline-none focus:border-blue-500 transition-colors cursor-pointer appearance-none">
                                        <option value="">All Counties</option>
                                    </select>
                                    <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-gray-500 pointer-events-none"></i>
                                </div>
                            </div>

                            <!-- Tournament Type -->
                            <div id="filter-event-type">
                                <h3 class="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-2 border-b border-white/10 pb-2">Tournament Type</h3>
                                <select id="dir-event-type" onchange="app.filterDirectory()" class="w-full bg-white/5 border border-white/10 rounded-sm p-3 text-xs text-white outline-none focus:border-blue-500 transition-colors cursor-pointer">
                                    <option value="">All Types</option>
                                    <option value="Congress">Congress</option>
                                    <option value="Rapid">Rapidplay</option>
                                    <option value="Blitz">Blitz</option>
                                    <option value="Junior">Junior</option>
                                    <option value="Championship">Championship</option>
                                    <option value="Grand Prix">Grand Prix</option>
                                    <option value="Tournament">Tournament</option>
                                </select>
                            </div>

                            <!-- Date From -->
                            <div id="filter-date-from">
                                <h3 class="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-2 border-b border-white/10 pb-2">Tournaments From</h3>
                                <input type="date" id="dir-date-from" onchange="app.filterDirectory()"
                                    class="w-full bg-white/5 border border-white/10 rounded-sm p-3 text-xs text-white outline-none focus:border-blue-500 transition-colors cursor-pointer">
                            </div>
                        </div>

                        <!-- Results count -->
                        <div id="dir-count" class="text-[10px] text-gray-500 uppercase tracking-widest mb-4">Loadingâ€¦</div>
                    </div>

                    <!-- Combined List -->
                    <div id="directory-list" class="px-3 pb-6 space-y-2 flex-grow"></div>
                </aside>

                <!-- RIGHT: Map -->
                <main id="main-map-container-dir" class="flex-grow relative">
                    <div id="map-directory" class="absolute inset-0 bg-slate-950 z-0"></div>
                </main>
            </div>
        </div>
    </div>
    </div>

    <!-- Footer (only on home) -->
    <footer id="main-footer" class="bg-slate-950 border-t border-white/10 py-12">
        <div class="max-w-7xl mx-auto px-6 md:px-12 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white/5 border border-white/10 flex items-center justify-center rounded-sm">
                    <i data-lucide="crown" class="w-4 h-4 text-blue-400"></i>
                </div>
                <span class="font-bold tracking-widest uppercase text-sm">UK<span class="font-light text-gray-500">Chess</span></span>
            </div>
            <div class="flex gap-8 text-[10px] uppercase tracking-widest text-gray-500 font-medium">
                <a href="#" class="hover:text-white transition-colors">Privacy</a>
                <a href="#" class="hover:text-white transition-colors">Terms</a>
                <a href="#" class="hover:text-white transition-colors">Contact</a>
                <a href="#" class="hover:text-white transition-colors">API</a>
            </div>
            <p class="text-[10px] text-gray-600 uppercase tracking-widest">Â© 2026 UK Chess Directory. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="data.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
